[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logic2live"
dynamic = ["version"]
description = "Logic Pro to Ableton Live conversion that carries third-party plugin state, automation and mixer across (fork of logic2ableton)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "evilander" }]
keywords = ["logic-pro", "ableton", "pro-tools", "ptx", "daw", "converter", "music-production", "session-transfer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
logic2live = "logic2ableton.cli:main"
ableton2logic = "logic2ableton.cli:main"
protools2ableton = "logic2ableton.cli:main"
protools2logic = "logic2ableton.cli:main"
ableton2protools = "logic2ableton.cli:main"
logic2protools = "logic2ableton.cli:main"

[project.urls]
Homepage = "https://github.com/biogin/logic2live"
Repository = "https://github.com/biogin/logic2live"
Upstream = "https://github.com/Evilander/logic2ableton"

[tool.setuptools.packages.find]
include = ["logic2ableton*"]

[tool.setuptools.package-data]
logic2ableton = ["data/*.als"]

[tool.setuptools.dynamic]
version = { attr = "logic2ableton.__version__" }

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "needs_test_project: test requires a local .logicx project",
    "needs_vst3: test requires local VST3 plugins",
    "needs_ptx_fixture: test requires a local Pro Tools .ptx session",
]
